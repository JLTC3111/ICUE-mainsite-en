        <fieldset class="payment-methods">
          <legend style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">Payment method</legend>
          <label>Payment method</label>
          <div class="payment-method-grid" id="paymentMethodGrid">
            <label class="payment-method active" data-provider="momo">
              <input type="radio" name="paymentMethod" value="momo" checked>
              <span class="payment-method-logo momo" aria-hidden="true">M</span>
              <span>MoMo</span>
            </label>
            <label class="payment-method" data-provider="zalopay">
              <input type="radio" name="paymentMethod" value="zalopay">
              <span class="payment-method-logo zalopay" aria-hidden="true">Z</span>
              <span>ZaloPay</span>
            </label>
            <label class="payment-method" data-provider="vnpay">
              <input type="radio" name="paymentMethod" value="vnpay">
              <span class="payment-method-logo vnpay" aria-hidden="true">VN</span>
              <span>VNPay</span>
            </label>
            <label class="payment-method" data-provider="paypal">
              <input type="radio" name="paymentMethod" value="paypal">
              <span class="payment-method-logo paypal" aria-hidden="true">PP</span>
              <span>PayPal</span>
            </label>
            <label class="payment-method" data-provider="bank_transfer">
              <input type="radio" name="paymentMethod" value="bank_transfer">
              <span class="payment-method-logo bank" aria-hidden="true">₫</span>
              <span>Bank transfer</span>
            </label>
          </div>
        </fieldset>
