[build]
  command = "npm run build"
  publish = "dist-home"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/bgVideos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/legacy-embed/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Direct visits to React/legacy-migrated routes must return the SPA shell.
# Existing static files still win because this rewrite is not forced.
# Contact is served by the shared Contact app on icue.vn (contact-app in the vn
# repo), not by a local shell. ?site=en keeps it in English and points its
# chrome back at en.icue.vn.
[[redirects]]
  from = "/contact"
  to = "https://icue.vn/contact?site=en"
  status = 301
  force = true

[[redirects]]
  from = "/contact/"
  to = "https://icue.vn/contact?site=en"
  status = 301
  force = true

[[redirects]]
  from = "/legacy/pages/Contact.html"
  to = "https://icue.vn/contact?site=en"
  status = 301
  force = true

[[redirects]]
  from = "/about-us"
  to = "/about-us.html"
  status = 200

# /our-work is not a route of this site: _redirects 301s it to the shared Our
# Work app on icue.vn. No shell rewrite here — there is no our-work.html.

[[redirects]]
  from = "/past-projects"
  to = "/past-projects.html"
  status = 200

[[redirects]]
  from = "/recruitment"
  to = "/recruitment.html"
  status = 200

[[redirects]]
  from = "/news-archive"
  to = "/news-archive.html"
  status = 200

[[redirects]]
  from = "/notable-awards"
  to = "/notable-awards.html"
  status = 200

[[redirects]]
  from = "/community-activities"
  to = "/community-activities.html"
  status = 200

[[redirects]]
  from = "/faqs"
  to = "/faqs.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/gdpr"
  to = "/gdpr.html"
  status = 200

[[redirects]]
  from = "/cookies"
  to = "/cookies.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
