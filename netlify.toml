  status = 301
  force = true

[[redirects]]
  from = "/legal/cookies"
  to = "https://icue.vn/legal/cookies?lang=en"
  status = 301
  force = true

[[redirects]]
  from = "/legal/cookies/"
  to = "https://icue.vn/legal/cookies?lang=en"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "https://icue.vn/legal/privacy?lang=en"
  status = 301
  force = true

[[redirects]]
  from = "/terms"
  to = "https://icue.vn/legal/terms?lang=en"
  status = 301
  force = true

[[redirects]]
  from = "/gdpr"
  to = "https://icue.vn/legal/gdpr?lang=en"
  status = 301
  force = true

[[redirects]]
  from = "/cookies"
  to = "https://icue.vn/legal/cookies?lang=en"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
