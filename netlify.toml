[build]
  command = "npm run build"
  publish = "dist-home"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/bgVideos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/legacy-embed/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Direct visits to React/legacy-migrated routes must return the SPA shell.
# Existing static files still win because this rewrite is not forced.
# Contact is served by the shared Contact app on icue.vn (contact-app in the vn
# repo), not by a local shell. ?site=en keeps it in English and points its
# chrome back at en.icue.vn.
[[redirects]]
  from = "/contact"
  to = "https://icue.vn/contact?site=en"
  status = 301
  force = true

[[redirects]]
  from = "/contact/"
  to = "https://icue.vn/contact?site=en"
  status = 301
  force = true

[[redirects]]
  from = "/legacy/pages/Contact.html"
  to = "https://icue.vn/contact?site=en"
  status = 301
  force = true

[[redirects]]
  from = "/about-us"
  to = "https://icue.vn/about-us?site=en"
  status = 301
  force = true

[[redirects]]
  from = "/about-us/"
  to = "https://icue.vn/about-us?site=en"
  status = 301
  force = true

[[redirects]]
  from = "/about-us.html"
  to = "https://icue.vn/about-us?site=en"
  status = 301
  force = true

[[redirects]]
  from = "/legacy/pages/aboutUs.html"
  to = "https://icue.vn/about-us?site=en"
  status = 301
  force = true

# Netlify's Pretty URLs normalization can lowercase and remove the extension
# before redirect processing. Keep both normalized aliases from falling into
# the SPA shell if an older link still points at aboutUs.html.
[[redirects]]
  from = "/legacy/pages/aboutus.html"
  to = "https://icue.vn/about-us?site=en"
  status = 301
  force = true

[[redirects]]
  from = "/legacy/pages/aboutus"
  to = "https://icue.vn/about-us?site=en"
  status = 301
  force = true

# /our-work is not a route of this site: _redirects 301s it to the shared Our
# Work app on icue.vn. No shell rewrite here — there is no our-work.html.

[[redirects]]
  from = "/past-projects"
  to = "/past-projects.html"
  status = 200

# /recruitment is not a route of this site: _redirects 301s it to the shared
# recruitment app on icue.vn. No shell rewrite here — one would win over the
# redirect and serve a dead page.

[[redirects]]
  from = "/news-archive"
  to = "/news-archive.html"
  status = 200

[[redirects]]
  from = "/notable-awards"
  to = "/notable-awards.html"
  status = 200

# /community-activities is not a route of this site: _redirects 301s it to the
# shared Community Activities app on icue.vn. No shell rewrite here — one
# would win over the redirect and serve a dead page.

# /faqs is not a route of this site either — same arrangement as /recruitment
# and /our-work above.

# The consolidated Legal app on icue.vn owns every document in every language.
# These are forced because older deploys produced matching local HTML shells.
[[redirects]]
  from = "/legal"
  to = "https://icue.vn/legal/privacy?lang=en"
  status = 301
  force = true

[[redirects]]
  from = "/legal/privacy"
