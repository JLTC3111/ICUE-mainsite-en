  status = 301
  force = true

[[redirects]]
  from = "/legal/terms/"
  to = "https://icue.vn/legal/terms?lang=en"
  status = 301
  force = true

[[redirects]]
  from = "/legal/gdpr"
  to = "https://icue.vn/legal/gdpr?lang=en"
  status = 301
  force = true

[[redirects]]
  from = "/legal/gdpr/"
