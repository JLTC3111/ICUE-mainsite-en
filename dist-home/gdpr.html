3cg>\n\t\t\t\u003crect fill=\"#2A66B7\" width=\"130\" height=\"120\"/>\n\t\t\t\u003cpolygon fill=\"#FCBE1F\" points=\"65,11 67.8,16.9 74,17.9 69.5,22.5 70.6,29 65,25.9 59.4,29 60.5,22.5 56,17.9 62.2,16.9 \t\t\t\"/>\n\t\t\t\u003cpolygon fill=\"#FCBE1F\" points=\"65,91 67.8,96.9 74,97.9 69.5,102.5 70.6,109 65,105.9 59.4,109 60.5,102.5 56,97.9 62.2,96.9 \n\t\t\t\t\t\t\t\"/>\n\t\t\t\u003cpolygon fill=\"#FCBE1F\" points=\"105,51 107.8,56.9 114,57.9 109.5,62.5 110.6,69 105,65.9 99.4,69 100.5,62.5 96,57.9 \n\t\t\t\t102.2,56.9 \t\t\t\"/>\n\t\t\t\u003cpolygon fill=\"#FCBE1F\" points=\"25,51 27.8,56.9 34,57.9 29.5,62.5 30.6,69 25,65.9 19.4,69 20.5,62.5 16,57.9 22.2,56.9 \t\t\t\"/>\n\t\t\t\u003cpolygon fill=\"#FCBE1F\" points=\"35.5,23 38.3,28.9 44.5,29.9 40,34.5 41.1,41 35.5,37.9 29.9,41 31,34.5 26.5,29.9 32.7,28.9 \t\t\t\n\t\t\t\t\"/>\n\t\t\t\u003cpolygon fill=\"#FCBE1F\" points=\"94.5,23 97.3,28.9 103.5,29.9 99,34.5 100.1,41 94.5,37.9 88.9,41 90,34.5 85.5,29.9 91.7,28.9 \n\t\t\t\t\t\t\t\"/>\n\t\t\t\u003cpolygon fill=\"#FCBE1F\" points=\"35.5,77.5 38.3,83.4 44.5,84.4 40,89 41.1,95.5 35.5,92.4 29.9,95.5 31,89 26.5,84.4 32.7,83.4 \n\t\t\t\t\t\t\t\"/>\n\t\t\t\u003cpolygon fill=\"#FCBE1F\" points=\"94.5,77.5 97.3,83.4 103.5,84.4 99,89 100.1,95.5 94.5,92.4 88.9,95.5 90,89 85.5,84.4 \n\t\t\t\t91.7,83.4 \t\t\t\"/>\n\t\t\u003c/g>\n\t\u003c/g>\n\t\u003cg id=\"Row_4\">\n\t\u003c/g>\n\t\u003cg id=\"Row_3\">\n\t\u003c/g>\n\t\u003cg id=\"Row_2\">\n\t\u003c/g>\n\t\u003cg id=\"Row_1\">\n\t\u003c/g>\n\u003c/g>\n\u003c/svg> GDPR applies to any organization that processes personal data of EU citizens, regardless of where the organization is located.\u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"highlight-box\">\n                    \u003cdiv>At ICUE, we are committed to full compliance with GDPR to protect your privacy and personal data, especially in international cooperation with EU partners.\u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"content-section\">\n            \u003ch2 class=\"section-title\">Your GDPR Rights\u003c/h2>\n            \u003cdiv class=\"section-content\">\n                \u003cdiv>Under GDPR, you have 8 fundamental rights regarding your personal data:\u003c/div>\n\n                \u003cdiv class=\"right-card\">\n                    \u003ch3>1. Right to be Informed\u003c/h3>\n                    \u003cdiv>You have the right to know:\u003c/div>\n                    \u003cul>\n                        \u003cli>What types of personal data are collected\u003c/li>\n                        \u003cli>The purpose of data usage\u003c/li>\n                        \u003cli>How long the data will be stored\u003c/li>\n                        \u003cli>Which third parties may access your data\u003c/li>\n                    \u003c/ul>\n                \u003c/div>\n\n                \u003cdiv class=\"right-card\">\n                    \u003ch3>2. Right of Access\u003c/h3>\n                    \u003cdiv>You have the right to:\u003c/div>\n                    \u003cul>\n                        \u003cli>Request confirmation of data processing\u003c/li>\n                        \u003cli>Receive a copy of your personal data\u003c/li>\n                        \u003cli>Know how your data is being processed\u003c/li>\n                        \u003cli>Obtain this information free of charge (unless requests are repeated or excessive)\u003c/li>\n                    \u003c/ul>\n                \u003c/div>\n\n                \u003cdiv class=\"right-card\">\n                    \u003ch3>3. Right to Rectification\u003c/h3>\n                    \u003cdiv>You have the right to:\u003c/div>\n                    \u003cul>\n                        \u003cli>Request correction of inaccurate data\u003c/li>\n                        \u003cli>Provide additional information if incomplete\u003c/li>\n                        \u003cli>Update outdated information\u003c/li>\n                        \u003cli>Receive a response within 1 month\u003c/li>\n                    \u003c/ul>\n                \u003c/div>\n\n                \u003cdiv class=\"right-card\">\n                    \u003ch3>4. Right to Erasure / “Right to be Forgotten”\u003c/h3>\n                    \u003cdiv>You may request deletion of data when:\u003c/div>\n                    \u003cul>\n                        \u003cli>The data is no longer needed for its original purpose\u003c/li>\n                        \u003cli>You withdraw consent\u003c/li>\n                        \u003cli>The data was processed unlawfully\u003c/li>\n                        \u003cli>Deletion is necessary for legal compliance\u003c/li>\n                    \u003c/ul>\n                \u003c/div>\n\n                \u003cdiv class=\"right-card\">\n                    \u003ch3>5. Right to Restrict Processing\u003c/h3>\n                    \u003cdiv>You may temporarily restrict data processing when:\u003c/div>\n                    \u003cul>\n                        \u003cli>There is a dispute about data accuracy\u003c/li>\n                        \u003cli>Processing is unlawful but you do not want deletion\u003c/li>\n                        \u003cli>The data is needed for legal purposes\u003c/li>\n                        \u003cli>A pending objection is under verification\u003c/li>\n                    \u003c/ul>\n                \u003c/div>\n\n                \u003cdiv class=\"right-card\">\n                    \u003ch3>6. Right to Data Portability\u003c/h3>\n                    \u003cdiv>You have the right to:\u003c/div>\n                    \u003cul>\n                        \u003cli>Receive your data in a commonly used, structured format\u003c/li>\n                        \u003cli>Transfer your data to another service provider\u003c/li>\n                        \u003cli>Request direct transfer (if technically feasible)\u003c/li>\n                        \u003cli>Applies to data processed automatically\u003c/li>\n                    \u003c/ul>\n                \u003c/div>\n\n                \u003cdiv class=\"right-card\">\n                    \u003ch3>7. Right to Object\u003c/h3>\n                    \u003cdiv>You may object to:\u003c/div>\n                    \u003cul>\n                        \u003cli>Processing for direct marketing purposes\u003c/li>\n                        \u003cli>Processing based on legitimate interests\u003c/li>\n                        \u003cli>Processing for scientific research\u003c/li>\n                        \u003cli>Automated profiling\u003c/li>\n                    \u003c/ul>\n                \u003c/div>\n\n                \u003cdiv class=\"right-card\">\n                    \u003ch3>8. Rights related to Automated Decision-Making\u003c/h3>\n                    \u003cdiv>You have the right to:\u003c/div>\n                    \u003cul>\n                        \u003cli>Not be subject to decisions made solely by automation\u003c/li>\n                        \u003cli>Understand the logic behind automated processing\u003c/li>\n                        \u003cli>Request human intervention\u003c/li>\n                        \u003cli>Challenge automated decisions\u003c/li>\n                    \u003c/ul>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"content-section\">\n            \u003ch2 class=\"section-title\">How to Exercise Your Rights\u003c/h2>\n            \u003cdiv class=\"section-content\">\n                \u003cdiv>To exercise your GDPR rights, you can contact us through the following steps:\u003c/div>\n\n                \u003cdiv class=\"timeline\">\n                    \u003cdiv class=\"timeline-item\">\n                        \u003cdiv class=\"timeline-number\">1\u003c/div>\n                        \u003cdiv class=\"timeline-content\">\n                            \u003ch4>Identify Request\u003c/h4>\n                            \u003cdiv>Select the GDPR right you wish to exercise and prepare necessary details.\u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"timeline-item\">\n                        \u003cdiv class=\"timeline-number\">2\u003c/div>\n                        \u003cdiv class=\"timeline-content\">\n                            \u003ch4>Submit Request\u003c/h4>\n                            \u003cdiv>Use the form below or email info@icue.vn with details.\u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"timeline-item\">\n                        \u003cdiv class=\"timeline-number\">3\u003c/div>\n                        \u003cdiv class=\"timeline-content\">\n                            \u003ch4>Verify Identity\u003c/h4>\n                            \u003cdiv>We may request ID verification to protect your data.\u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"timeline-item\">\n                        \u003cdiv class=\"timeline-number\">4\u003c/div>\n                        \u003cdiv class=\"timeline-content\">\n                            \u003ch4>Processing\u003c/h4>\n                            \u003cdiv>We will process your request within 30 days (may extend to 60 days for complex cases).\u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"timeline-item\">\n                        \u003cdiv class=\"timeline-number\">5\u003c/div>\n                        \u003cdiv class=\"timeline-content\">\n                            \u003ch4>Receive Response\u003c/h4>\n                            \u003cdiv>You will receive a detailed response regarding the outcome of your request.\u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"content-section\">\n            \u003ch2 class=\"section-title\">Submit a GDPR Request\u003c/h2>\n            \u003cdiv class=\"section-content\">\n                \u003cdiv class=\"request-form\">\n                    \u003ch3>GDPR Rights Request Form\u003c/h3>\n                    \u003cform>\n                        \u003cdiv class=\"form-group\">\n                            \u003clabel for=\"requestType\">Request Type *\u003c/label>\n                            \u003cselect id=\"requestType\" required>\n                                \u003coption value=\"\">Select request type\u003c/option>\n                                \u003coption value=\"access\">Right of Access\u003c/option>\n                                \u003coption value=\"rectification\">Right to Rectification\u003c/option>\n                                \u003coption value=\"erasure\">Right to Erasure\u003c/option>\n                                \u003coption value=\"restrict\">Right to Restrict Processing\u003c/option>\n                                \u003coption value=\"portability\">Right to Data Portability\u003c/option>\n                                \u003coption value=\"object\">Right to Object\u003c/option>\n                                \u003coption value=\"automated\">Rights related to Automation\u003c/option>\n                                \u003coption value=\"other\">Other\u003c/option>\n                            \u003c/select>\n                        \u003c/div>\n\n                        \u003cdiv class=\"form-group\">\n                            \u003clabel for=\"fullName\">Full Name *\u003c/label>\n                            \u003cinput type=\"text\" id=\"fullName\" required>\n                        \u003c/div>\n\n                        \u003cdiv class=\"form-group\">\n                            \u003clabel for=\"email\">Email *\u003c/label>\n                            \u003cinput type=\"email\" id=\"email\" required>\n                        \u003c/div>\n\n                        \u003cdiv class=\"form-group\">\n                            \u003clabel for=\"phone\">Phone Number\u003c/label>\n                            \u003cinput type=\"tel\" id=\"phone\">\n                        \u003c/div>\n\n                        \u003cdiv class=\"form-group\">\n                            \u003clabel for=\"details\">Request Details *\u003c/label>\n                            \u003ctextarea id=\"details\" placeholder=\"Please describe your request in detail. Include: type of data, timeframe, purpose, and other relevant information.\" required>\u003c/textarea>\n                        \u003c/div>\n\n                        \u003cdiv class=\"form-group\">\n                            \u003clabel for=\"identification\">Identity Verification\u003c/label>\n                            \u003ctextarea id=\"identification\" placeholder=\"To protect your data, please provide identity verification (e.g., ID/passport number, tax number, or other information previously provided to ICUE).\">\u003c/textarea>\n                        \u003c/div>\n\n                        \u003cbutton type=\"submit\" class=\"submit-btn\">Submit GDPR Request\u003c/button>\n                    \u003c/form>\n                \u003c/div>\n\n                \u003cdiv class=\"highlight-box\">\n                    \u003cdiv>\u003csvg style=\"transform:translateY(3px)\" width=\"17px\" height=\"17px\" viewBox=\"0 0 48 48\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n                    \u003crect width=\"48\" height=\"48\" fill=\"white\" fill-opacity=\"0.01\"/>\n                    \u003cpath d=\"M4 39H44V24V9H24H4V24V39Z\" fill=\"#2F88FF\" stroke=\"#000000\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n                    \u003cpath d=\"M4 9L24 24L44 9\" stroke=\"white\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n                    \u003cpath d=\"M24 9H4V24\" stroke=\"#000000\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n                    \u003cpath d=\"M44 24V9H24\" stroke=\"#000000\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n                    \u003c/svg> You can also send requests directly by email to \u003cstrong>info@icue.vn\u003c/strong> with the subject “[GDPR Request] - [Request Type]”\u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"content-section\">\n            \u003ch2 class=\"section-title\">Processing Time & Fees\u003c/h2>\n            \u003cdiv class=\"section-content\">\n                \u003cdiv class=\"timeline\">\n                    \u003cdiv class=\"timeline-item\">\n                        \u003cdiv class=\"timeline-number\">\u003csvg width=\"20px\" height=\"20px\" viewBox=\"0 0 512 512\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" aria-hidden=\"true\" role=\"img\" class=\"iconify iconify--fxemoji\" preserveAspectRatio=\"xMidYMid meet\">\u003cpath fill=\"#6B8DA1\" d=\"M275.816 58.999v123.14c0 10.899-8.917 19.816-19.816 19.816s-19.816-8.917-19.816-19.816V58.999c0-10.899 8.917-19.816 19.816-19.816s19.816 8.917 19.816 19.816zm91.749 103.044c7.738 7.738 20.284 7.739 28.022.001l50.586-50.586c7.738-7.738 7.738-20.285 0-28.023c-7.738-7.738-20.285-7.738-28.023 0l-50.586 50.586c-7.737 7.738-7.736 20.285.001 28.022m-223.123.001c7.738-7.738 7.739-20.284.001-28.022L93.857 83.436c-7.738-7.738-20.285-7.738-28.023 0c-7.738 7.738-7.738 20.285 0 28.023l50.586 50.586c7.738 7.737 20.284 7.737 28.022-.001m258.984 320.575c7.706-7.706 7.706-20.317 0-28.023l-87.073-87.073c-7.706-7.706-20.317-7.706-28.023 0c-7.706 7.706-7.706 20.317 0 28.023l87.073 87.073c7.706 7.706 20.317 7.706 28.023 0zm-266.829 0l87.073-87.073c7.706-7.706 7.706-20.317 0-28.023c-7.706-7.706-20.317-7.706-28.023 0l-87.073 87.073c-7.706 7.706-7.706 20.317 0 28.023c7.706 7.706 20.317 7.706 28.023 0z\">\u003c/path>\u003cpath fill=\"#FFB636\" d=\"M354.319 45.692c36.12
