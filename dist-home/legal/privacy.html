section-title {\n            color: white;\n        }\n\n        .gdpr-section .section-content div,\n        .gdpr-section .section-content li {\n            color: rgba(255, 255, 255, 0.9);\n        }\n\n        .data-table {\n            width: 100%;\n            border-collapse: collapse;\n            margin: 20px 0;\n        }\n\n        .data-table th,\n        .data-table td {\n            font-size: clamp(0.65rem, 2vw, 1rem);\n            padding: 12px;\n            text-align: left;\n            border-bottom: 1px solid #e2e8f0;\n        }\n\n        .data-table th {\n            background-color: #fef3c7;\n            font-weight: 600;\n            color: #1e293b;\n        }\n\n        .data-table tr:nth-child(even) {\n            background-color: #fefcf3;\n        }\n\n        @media (max-width: 768px) {\n            .header {\n                padding: 60px 15px 40px;\n                margin-top: 15%;\n            }\n\n            .header h1 {\n                font-size: clamp(1.25rem, 5vw, 2.5rem);\n            }\n\n            .data-table {\n                width: 100%;\n                border-collapse: collapse;\n                margin: 20px 0;\n\n                /* important to enforce column widths */\n                table-layout: fixed;\n            }\n\n            .data-table th,\n            .data-table td {\n                font-size: clamp(0.65rem, 2vw, 1rem);\n                padding: 12px;\n                text-align: left;\n                border-bottom: 1px solid #e2e8f0;\n\n                /* prevent text from overflowing */\n                word-wrap: break-word;\n                overflow-wrap: break-word;\n            }\n\n            /* Example: control each column */\n            .data-table th:nth-child(1),\n            .data-table td:nth-child(1) {\n                max-width: 120px;\n            }\n\n            .data-table th:nth-child(2),\n            .data-table td:nth-child(2) {\n                max-width: 150px;\n            }\n\n            .data-table th:nth-child(3),\n            .data-table td:nth-child(3) {\n                max-width: 100px;\n            }\n\n            .container {\n                padding: 40px 15px;\n            }\n\n            .content-section {\n                padding: 25px;\n            }\n\n            .section-title {\n                font-size: clamp(1.1rem, 3.75vw, 1.5rem);\n            }\n\n            .contact-info {\n                font-size: clamp(0.7rem, 3.5vw, 1rem);\n            }\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody data-footer=\"true\" class=\"with-footer\">\n    \u003cdiv class=\"header\">\n        \u003ch1>Privacy Policy\u003c/h1>\n        \u003cdiv>Commitment to protecting your personal information and privacy\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"container\">\n        \u003cdiv class=\"content-section\">\n            \u003ch2 class=\"section-title\">Overview\u003c/h2>\n            \u003cdiv class=\"section-content\">\n                \u003cdiv>The Institute for Economic, Urban, and Construction Research (ICUE) is committed to protecting your privacy and personal data. This policy explains how we collect, use, store, and safeguard your data.\u003c/div>\n                \n                \u003cdiv class=\"highlight-box\">\n                    \u003cdiv>🔒 We strictly comply with Vietnam’s personal data protection regulations and the EU’s GDPR.\u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"content-section\">\n            \u003ch2 class=\"section-title\">Information We Collect\u003c/h2>\n            \u003cdiv class=\"section-content\">\n                \u003cdiv>We may collect the following types of information:\u003c/div>\n                \u003cul>\n                    \u003cli>\u003cstrong>Personal information:\u003c/strong> Full name, email, phone number, address\u003c/li>\n                    \u003cli>\u003cstrong>Professional information:\u003c/strong> Work experience, education, skills\u003c/li>\n                    \u003cli>\u003cstrong>Technical information:\u003c/strong> IP address, browser type, device used\u003c/li>\n                    \u003cli>\u003cstrong>Interaction information:\u003c/strong> How you use the website, pages viewed, access times\u003c/li>\n                    \u003cli>\u003cstrong>Cookies and tracking data:\u003c/strong> To improve user experience\u003c/li>\n                \u003c/ul>\n\n                \u003ctable class=\"data-table\">\n                    \u003cthead>\n                        \u003ctr>\n                            \u003cth>Data Type\u003c/th>\n                            \u003cth>Purpose\u003c/th>\n                            \u003cth>Retention Period\u003c/th>\n                        \u003c/tr>\n                    \u003c/thead>\n                    \u003ctbody>\n                        \u003ctr>\n                            \u003ctd>Contact information\u003c/td>\n                            \u003ctd>Responding to requests, sending project updates\u003c/td>\n                            \u003ctd>3 years or until deletion is requested\u003c/td>\n                        \u003c/tr>\n                        \u003ctr>\n                            \u003ctd>CV and application documents\u003c/td>\n                            \u003ctd>Candidate evaluation, application record keeping\u003c/td>\n                            \u003ctd>2 years after application\u003c/td>\n                        \u003c/tr>\n                        \u003ctr>\n                            \u003ctd>Website data\u003c/td>\n                            \u003ctd>Analysis, website improvement\u003c/td>\n                            \u003ctd>12 months\u003c/td>\n                        \u003c/tr>\n                    \u003c/tbody>\n                \u003c/table>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"content-section\">\n            \u003ch2 class=\"section-title\">How We Use Information\u003c/h2>\n            \u003cdiv class=\"section-content\">\n                \u003cdiv>Your information is used for the following purposes:\u003c/div>\n                \u003cul>\n                    \u003cli>Providing consulting and customer support services\u003c/li>\n                    \u003cli>Processing applications and managing HR\u003c/li>\n                    \u003cli>Sending project, event, and collaboration updates\u003c/li>\n                    \u003cli>Improving website and service quality\u003c/li>\n                    \u003cli>Analyzing trends and usage statistics\u003c/li>\n                    \u003cli>Complying with legal and regulatory requirements\u003c/li>\n                \u003c/ul>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"content-section\">\n            \u003ch2 class=\"section-title\">Information Security\u003c/h2>\n            \u003cdiv class=\"section-content\">\n                \u003cdiv>We apply strict security measures:\u003c/div>\n                \u003cul>\n                    \u003cli>SSL/TLS encryption for all transmitted data\u003c/li>\n                    \u003cli>Regularly updated firewalls and antivirus software\u003c/li>\n                    \u003cli>Strict access control with multi-factor authentication\u003c/li>\n                    \u003cli>Regular backups and recovery plans\u003c/li>\n                    \u003cli>Employee training on information security\u003c/li>\n                    \u003cli>Periodic third-party security audits\u003c/li>\n                \u003c/ul>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"content-section\">\n            \u003ch2 class=\"section-title\">Information Sharing\u003c/h2>\n            \u003cdiv class=\"section-content\">\n                \u003cdiv>We may share your information in the following cases:\u003c/div>\n                \u003cul>\n                    \u003cli>\u003cstrong>With partners:\u003c/strong> When necessary to perform a project or service\u003c/li>\n                    \u003cli>\u003cstrong>With legal authorities:\u003c/strong> Upon request from competent authorities\u003c/li>\n                    \u003cli>\u003cstrong>With service providers:\u003c/strong> Third parties supporting website and service operations\u003c/li>\n                    \u003cli>\u003cstrong>In case of M&A:\u003c/strong> If ICUE merges or is acquired\u003c/li>\n                \u003c/ul>\n                \n                \u003cdiv class=\"highlight-box\">\n                    \u003cdiv>⚠️ We DO NOT sell or rent your personal data to third parties for commercial purposes.\u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"content-section gdpr-section\" id=\"gdpr\">\n            \u003ch2 class=\"section-title\">Your Rights under GDPR\u003c/h2>\n            \u003cdiv class=\"section-content\">\n                \u003cdiv>Under GDPR, you have the following rights regarding your personal data:\u003c/div>\n                \u003cul>\n                    \u003cli>\u003cstrong>Right of access:\u003c/strong> Request a copy of your personal data we store\u003c/li>\n                    \u003cli>\u003cstrong>Right to rectification:\u003c/strong> Update or correct inaccurate information\u003c/li>\n                    \u003cli>\u003cstrong>Right to erasure:\u003c/strong> Request deletion of personal data (under certain conditions)\u003c/li>\n                    \u003cli>\u003cstrong>Right to restriction of processing:\u003c/strong> Temporarily stop data processing in certain cases\u003c/li>\n                    \u003cli>\u003cstrong>Right to data portability:\u003c/strong> Receive data in a readable format\u003c/li>\n                    \u003cli>\u003cstrong>Right to object:\u003c/strong> Refuse processing of data for marketing purposes\u003c/li>\n                \u003c/ul>\n                \n                \u003cdiv>To exercise these rights, please contact us using the information below.\u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"content-section\">\n            \u003ch2 class=\"section-title\">Cookies and Tracking\u003c/h2>\n            \u003cdiv class=\"section-content\">\n                \u003cdiv>Our website uses cookies and similar tracking technologies to:\u003c/div>\n                \u003cul>\n                    \u003cli>Remember your preferences and settings\u003c/li>\n                    \u003cli>Analyze traffic and user behavior\u003c/li>\n                    \u003cli>Improve performance and user experience\u003c/li>\n                    \u003cli>Provide relevant content and ads\u003c/li>\n                \u003c/ul>\n                \n                \u003cdiv>You can manage cookies in your browser settings or \u003ca href=\"/legacy/pages/cookies.html\" style=\"color: #1e40af; text-decoration: underline;\">view detailed cookies policy\u003c/a>.\u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"contact-info\">\n            \u003ch3>Contact for Privacy Issues\u003c/h3>\n            \u003cdiv>If you have any questions about this privacy policy or wish to exercise your rights:\u003c/div>\n            \u003cdiv>\u003cstrong>Email:\u003c/strong> \u003ca href=\"mailto:info@icue.vn\">info@icue.vn\u003c/a>\u003c/div>\n            \u003cdiv>\u003cstrong>Phone:\u003c/strong> \u003ca href=\"tel:+842437728485\">+84 24 3772 8485\u003c/a>\u003c/div>\n            \u003cdiv>\u003cstrong>Address:\u003c/strong> Institute for Economic, Urban, and Construction Research, 124 Hoang Ngan, Cau Giay, Hanoi\u003c/div>\n            \u003cdiv>We will respond to your request within 30 days.\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"last-updated\">\n            \u003cdiv>This policy was last updated on: \u003cstrong>August 18, 2025\u003c/strong>\u003c/div>\n            \u003cdiv>We may update this policy from time to time. All changes will be posted on the website.\u003c/div>\n        \u003c/div>\n    \u003c/div>\n\u003c/body>\n\n\u003c/html>\n"</script>
