
<body>
    <div id="model-container"></div>

    <section class="about-legacy-hero" aria-label="About hero">
        <div class="about-legacy-hero__content">
            <h1 class="cursive-default">
                <span id="rainText" class="sub-text">BETTER TOGETHER</span>
                <span class="hero-body">Towards A Better Tomorrow!</span>
            </h1>

            <model-viewer 
                class="model-home"
                src="public/models/roman_boat.glb" 
                alt="A 3D model of a Roman boat" 
                autoplay
                auto-rotate 
                camera-controls>
            </model-viewer>

            <div class="about-legacy-hero__slider">
                <div class="home-text-slider" id="homeTextSlider">
                    <div class="home-slider-text" id="homeSliderText">
                        <span class="highlight-text"></span>
                    </div>
                </div>

                <div class="slider-dots" id="sliderDots">
                    <span class="dot progress-dot" data-index="0"></span>
                    <span class="dot progress-dot" data-index="1"></span>
                    <span class="dot progress-dot" data-index="2"></span>
                    <span class="dot progress-dot" data-index="3"></span>
                    <span class="dot progress-dot" data-index="4"></span>
                    <span class="dot progress-dot" data-index="5"></span>
                </div>
            </div>
        </div>
    </section>
    
    <div class="about-container">
        <div class="section">
            <h1 class="greeting-text">HI THERE!</h1>
            <div class="highlight-container">
                <p class="highlight-firstPart">
                    <span class="c1">W</span>
                    <span class="c2">H</span>
                    <span class="c1">E</span>
                    <span class="c4">R</span>
                    <span class="c5">E</span>
                    <span class="c6">R</span>
                    <span class="c7">E</span>
                </p>
                <p class="highlight-secondPart">
                    <span class="c8">I</span>
                    <span class="c1">N</span>
                    <span class="c2">N</span>
                    <span class="c1">O</span>
                    <span class="c4">V</span>
                    <span class="c5">A</span>
                    <span class="c6">T</span>
                    <span class="c7">I</span>
                    <span class="c8">O</span>
                    <span class="c4">N</span>
                </p>
            </div>
        </div>
        <div>
            <p class="highlight-fourthPart">Meets <span class="extra-bold">URBAN</span> Excellence</p>
        </div>

        <div class="section">
            <h2 class="handwritten">We're a</h2>
            <span class="space-wide"></span>
            <div class="fuzzy-text">PASSIONATE</div>
            <p class="regular-text">team of urban development experts</p>
        </div>

        <div class="section">
            <h2 class="handwritten">Our People</h2>
            
            <div class="image-grid-top">
                <img src="public/aboutUs/kids2.png" alt="Urban Planning">
                <img src="public/aboutUs/hat.png" alt="Team Collaboration">
            </div>
            <div class="image-grid-mid">
                <img src="public/aboutUs/kids1.png" alt="Construction">
            </div>

            <p class="middle-text">More Than 10 Years of Urban Excellence</p>
        </div>

        <div class="section">
            <h2 class="handwritten">Meet Our Amazing Team</h2>
            <div class="image-grid-bottom">
                <img src="public/aboutUs/aboutUs1.png" alt="Our Vision">
                <img src="public/aboutUs/aboutUs2.png" alt="Our Mission">
                <img src="public/aboutUs/aboutUs3.png" alt="Our Values">
                <img src="public/aboutUs/aboutUs4.png" alt="Our Team">
            </div>
        </div>

        <div class="section contact-section">
            <h2 class="handwritten">Let's Connect!</h2> 
        </div>
        <button onclick="createBalloons()" id="balloonButton" class="balloon-button">🎈 Send Balloons</button>
        <video class="video-bg" muted loop playsinline preload="none">
            <source src="public/bgVideos/bg9.mp4" type="video/mp4" media="(min-width: 768px)">
            <source src="public/bgVideos/bg9-mobile.mp4" type="video/mp4">
        </video>
    </div>
    
</body>
</html>
