<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.4.6/css/flag-icon.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Audiowide&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav>
      <!-- Logo & Navigation Links -->
      <a href="/">Home</a>
      <a href="/#/News">News</a>
      <a href="/#/ourWork">Our Work</a>
      <a href="/#/pastProjects">Projects History</a>
      <a href="/#/aboutUs">About</a>

        <div class="language-switcher">
          <a href="https://icue.vn/src/pages/articles/article_hoian" class="flag-link">
              <span class="flag-icon flag-icon-vn"></span>    
          </a>
        </div>
    </nav>
  </header>
<style>
nav {
  position: relative;
  background-color: #333333;
  padding: 1rem 2rem;
  display: flex;
  gap: 2.5rem;
  justify-content: center;
  align-items: center;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
  top: 0;
  z-index: 1;
}

nav::before {
  filter: blur(2.5rem);
}

nav::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  height: 100%;
  background: conic-gradient(
    from 0deg,
       green,
       teal,
       darkorange,
       green
    );
  padding: 15px;
  border-radius: 50%;
  opacity: 0.1; /* Optional: adjust visibility */
  z-index: -3; /* Places the gradient behind nav content */
  pointer-events: none; /* Ensures it doesn't block clicks */
  animation: rotateRing 5s linear infinite; 
}

@keyframes rotateRing {
    0% {
        transform: translate(-50%, -50%) rotate(-5deg);
    }
    50% {
        transform: translate(-50%, -50%) rotate(5deg);
    }
    100% {
       transform: translate(-50%, -50%) rotate(-5deg);
    }
}

nav a {
  font-size: clamp(0.75rem, 2.5vw, 1rem);
  text-decoration: none;
  color: #ffffff;
  font-weight: 500;
  transition: color 0.3s;
}

nav a:hover {
  font-weight: bold;
  text-decoration: underline;
  transition: 0.3s;
  color: #007acc;
  transform: scale(1.1);
}

@media (max-width: 768px) {

  nav {
    margin-right: -1.5rem;
    gap: 1.5rem;
  }
  .flag-link {
    margin-left: -.5rem;
    font-size: 1.2rem;
  }
}

.card-detail {
  max-width: 800px;
  margin: 4rem auto;
  padding: 3.5rem;
  background-color: #ffffff;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
  border-radius: 12px;
  font-family: 'Segoe UI', sans-serif;
  line-height: 1.6;
}

.card-detail img {
  width: clamp(75%, 90vw, 100%);
  height: auto;
  border-radius: 8px;
  margin-bottom: 2rem;
  object-fit: cover;
}

.card-detail h1 {
  text-decoration: underline;
  font-size: clamp(0.9rem, 3.75vw, 2.5rem);;
  margin-bottom: 1rem;
  color: #333;
}

.card-detail p {
  font-size: clamp(0.75rem, 2.5vw, 1rem);
  color: #555;
  margin-bottom: 0.75rem;
}

.card-detail p strong {
  color: #222;
  margin-right: 0.5rem;
}

@media (max-width: 600px) {
  .card-detail {
    padding: 1rem;
    margin: 2rem 1rem;
  }
}
</style>
  <div class="card-detail">
    <img id="card-image" src="" alt="" />
    <h1 id="card-title"></h1>
    <p><strong>Description:</strong><span id="card-description"></spanid>></span></p>
    <p><strong>Location:</strong> <span id="card-location"></span></p>
    <p><strong>Year of Completion:</strong><span id="card-year"></span></p>
  </div>

  <script src="../card.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const cardId = params.get('id');
    const card = cards.find(c => c.id === cardId);

    if (!card) {
      document.body.innerHTML = "<h1>Card not found 😞</h1>";
    } else {
      document.getElementById("card-title").textContent = card.title;
      document.getElementById("card-description").textContent = card.description;
      document.getElementById("card-image").src = card.image;
      document.getElementById("card-image").alt = card.title;
      document.getElementById("card-location").textContent = card.location;
      document.getElementById("card-year").textContent = card.year;
    }
    fetch('src/components/navbar.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('navbar').innerHTML = html;
    });
  </script>
</body>
</html>
